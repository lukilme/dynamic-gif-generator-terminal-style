[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-gif-generator-terminal-style"
version = "0.1.0"
description = "Generate GitHub README dashboard GIFs from public GitHub repository data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "requests>=2.31.0",
  "Pillow>=10.2.0",
  "numpy>=1.26.0",
  "pandas>=2.1.2",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
]

[tool.setuptools]
packages = ["github_profile_gif", "plots"]
